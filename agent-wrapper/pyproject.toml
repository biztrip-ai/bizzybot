[project]
name = "bizzybot-agent-wrapper"
version = "0.1.0"
description = "Bizzybot OSS agent-wrapper: dials home to Central-Dispatch, receives Slack events over a WebSocket, drives Claude Code."
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.0",
    "slack-sdk>=3.27.0",
    "claude-agent-sdk>=0.1.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
bizzybot = "bizzybot_agent_wrapper.agent_wrapper:main_sync"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bizzybot_agent_wrapper"]
